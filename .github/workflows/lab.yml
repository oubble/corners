name: lab

on:
  push:
    branches: [main]
    paths: [demo/**, src/**, scripts/site.mjs, wrangler.jsonc]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lab
  cancel-in-progress: true

jobs:
  deploy:
    name: deploy lab.oubble.com/corners
    runs-on: ubuntu-latest
    environment:
      name: lab
      url: https://lab.oubble.com/corners/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm site
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.151.0
          command: deploy
